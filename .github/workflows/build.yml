name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-22.04
            package: linux-x86_64
            cmake_args: ''
          - name: Windows (x64)
            os: windows-2022
            package: windows-x64
            cmake_args: -A x64 -DOPENDT_VENDOR_SDL=ON
          - name: macOS (universal)
            os: macos-14
            package: macos-universal
            cmake_args: -DOPENDT_VENDOR_SDL=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        # Tests that need sample game data are reported as skipped (no game data in CI).
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          PROJECT_VERSION=$(sed -n 's/^project(OpenDT VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME}"; else VERSION="v${PROJECT_VERSION}-${GITHUB_SHA::7}"; fi
          NAME="opendt-${VERSION}-${{ matrix.package }}"
          cmake --install build --config Release --prefix "stage/${NAME}"
          mv "stage/${NAME}/bin/"* "stage/${NAME}/"
          rmdir "stage/${NAME}/bin"
          cp README.md LICENSE "stage/${NAME}/"
          mkdir -p "stage/${NAME}/licenses"
          cp third_party/ymfm/LICENSE "stage/${NAME}/licenses/ymfm-LICENSE.txt"
          if [[ "${{ matrix.package }}" == linux-* ]]; then
            tar -C stage -czf "${NAME}.tar.gz" "${NAME}"
            echo "ASSET=${NAME}.tar.gz" >> "$GITHUB_ENV"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd stage && 7z a -tzip "../${NAME}.zip" "${NAME}" > /dev/null)
            echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"
          else
            (cd stage && zip -qry "../${NAME}.zip" "${NAME}")
            echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"
          fi
          ls -la "stage/${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: opendt-${{ matrix.package }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Release
    # Every run except pull requests publishes releases:
    #  - push of a v* tag: a release for that tag;
    #  - push to main: if the version in CMakeLists.txt (project(OpenDT VERSION x.y.z)) has no release yet,
    #    a release vX.Y.Z is created for this commit. To cut a release, bump that version.
    #  - every non-tag run also replaces the rolling "latest" pre-release with this build.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "OpenDT $GITHUB_REF_NAME" --generate-notes

      - name: Create versioned release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^project(OpenDT VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$VERSION" ]; then echo "no version in CMakeLists.txt"; exit 1; fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists; bump the version in CMakeLists.txt to publish a new one."
          else
            gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "OpenDT v$VERSION" --generate-notes
          fi

      - name: Update the "latest" pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/* --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "OpenDT latest build (${GITHUB_SHA::7})" \
            --notes "Automatic build of commit ${GITHUB_SHA} (${GITHUB_REF_NAME}). This pre-release is replaced by every new build; see the versioned releases for stable downloads."
